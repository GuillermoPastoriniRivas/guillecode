name: Preparar versión de GuilleCode
run-name: Preparar GuilleCode ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión estable (X.Y.Z)
        required: true
        type: string
      notes:
        description: Novedades para los usuarios
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: guillecode-release
  cancel-in-progress: false
jobs:
  windows:
    if: github.repository == 'GuillermoPastoriniRivas/guillecode'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GC_RELEASE_VERSION: ${{ inputs.version }}
      GC_RELEASE_NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Instalar dependencias
        run: npm ci
      - name: Diagnóstico del escritorio Windows
        run: node tests/windows-desktop-capabilities.mjs
      - name: Preparar versión y novedades
        shell: pwsh
        run: |
          node scripts/release.mjs version $env:GC_RELEASE_VERSION
          node scripts/release.mjs check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GC_RELEASE_NOTES | Set-Content -Encoding utf8 release-notes.txt
          $tags = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tags -contains "v$env:GC_RELEASE_VERSION") { throw 'Esta versión ya existe; nunca se reemplazan sus artefactos.' }
          exit 0
      - name: Descargar motor fijado y verificar SHA256
        run: npm run release:engine
      - name: Descargar Whisper fijado y verificar SHA256
        run: npm run release:whisper
      - name: Verificaciones frontend
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compilar frontend y PWA
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:pwa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pruebas Rust
        working-directory: src-tauri
        run: cargo test --release --locked --lib
      - name: Integración real de equipos y recuperación
        run: |
          npm run test:teams
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:teams -- --no-git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:teams -- --auto --no-git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:teams:recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:teams:recovery -- --no-git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:teams:recovery -- --coordination --no-git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:teams:recovery -- --auto --coordination --no-git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verificar descarga firmada y actualización NSIS real
        run: npm run test:upgrade:native
      - name: Informe de actualización nativa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-upgrade-report
          path: test-results/upgrade-native-report.json
          if-no-files-found: ignore
      - name: Compilar y firmar instalador
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --ci -- --locked
      - name: Generar manifiesto
        run: npm run release:manifest -- src-tauri/target/release/bundle/nsis release-notes.txt
      - name: Empaquetar skills OpenCode
        run: python scripts/package-team-skills.py src-tauri/target/release/bundle/nsis
      - uses: actions/upload-artifact@v4
        with:
          name: guillecode-windows-${{ inputs.version }}
          path: |
            src-tauri/target/release/bundle/nsis/guillecode_${{ inputs.version }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/guillecode_${{ inputs.version }}_x64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
            src-tauri/target/release/bundle/nsis/release-info.json
            src-tauri/target/release/bundle/nsis/guillecode-team-skills-${{ inputs.version }}.zip
          if-no-files-found: error
      - name: Crear release borrador
        shell: pwsh
        run: |
          $assetNames = @("guillecode_$($env:GC_RELEASE_VERSION)_x64-setup.exe", "guillecode_$($env:GC_RELEASE_VERSION)_x64-setup.exe.sig", 'latest.json', 'release-info.json', "guillecode-team-skills-$($env:GC_RELEASE_VERSION).zip")
          $files = $assetNames | ForEach-Object { (Resolve-Path -LiteralPath (Join-Path 'src-tauri/target/release/bundle/nsis' $_)).Path }
          gh release create "v$env:GC_RELEASE_VERSION" @files --draft --target $env:GITHUB_SHA --title "GuilleCode $env:GC_RELEASE_VERSION" --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Borrador preparado. Probar upgrade antes de ejecutar Publicar versión." >> $env:GITHUB_STEP_SUMMARY
